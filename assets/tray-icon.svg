<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 菜单栏 template icon:透明背景 + 黑色线条。
       icon_as_template(true) 让系统按菜单栏亮暗自动反色。
       复用 app icon 的「中央 H 枢纽 + 6 节点辐射」结构,去掉彩色方块背景。 -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- 6 条连接线 (中央 → 外节点) -->
    <g stroke-width="1.6" opacity="0.85">
      <line x1="32" y1="32" x2="32" y2="13"/>
      <line x1="32" y1="32" x2="48.5" y2="15.5"/>
      <line x1="32" y1="32" x2="48.5" y2="48.5"/>
      <line x1="32" y1="32" x2="32" y2="51"/>
      <line x1="32" y1="32" x2="15.5" y2="48.5"/>
      <line x1="32" y1="32" x2="15.5" y2="15.5"/>
    </g>
    <!-- 6 个外节点 -->
    <g fill="#000000" stroke="none">
      <circle cx="32" cy="11" r="3"/>
      <circle cx="50" cy="14" r="3"/>
      <circle cx="50" cy="50" r="3"/>
      <circle cx="32" cy="53" r="3"/>
      <circle cx="14" cy="50" r="3"/>
      <circle cx="14" cy="14" r="3"/>
    </g>
    <!-- 中央枢纽圆 -->
    <circle cx="32" cy="32" r="9" stroke-width="2.2"/>
    <!-- 中央 H 形 -->
    <g stroke-width="2.4">
      <line x1="28.5" y1="28" x2="28.5" y2="36"/>
      <line x1="35.5" y1="28" x2="35.5" y2="36"/>
      <line x1="28.5" y1="32" x2="35.5" y2="32"/>
    </g>
  </g>
</svg>
