<svg viewBox="0 0 1200 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MemoryHub - Agent 记忆统一管理中心">
  <title>MemoryHub - Agent 记忆统一管理中心</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="420" rx="12" fill="url(#bg)"/>

  <!-- 细网格 -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- 连接线 (左侧 Agent → 中心 Hub) -->
  <g stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 120 80 Q 300 120 520 210" stroke="#a855f7"/>
    <path d="M 120 150 Q 300 170 520 210" stroke="#22c55e"/>
    <path d="M 120 210 Q 300 210 520 210" stroke="#f97316"/>
    <path d="M 120 270 Q 300 250 520 210" stroke="#3b82f6"/>
    <path d="M 120 340 Q 300 300 520 210" stroke="#14b8a6"/>
  </g>

  <!-- 左侧 Agent 节点 -->
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#a1a1aa">
    <!-- Hermes -->
    <circle cx="120" cy="80" r="5" fill="#a855f7"/>
    <text x="135" y="84">Hermes</text>
    <!-- Codex -->
    <circle cx="120" cy="150" r="5" fill="#22c55e"/>
    <text x="135" y="154">Codex</text>
    <!-- Claude -->
    <circle cx="120" cy="210" r="5" fill="#f97316"/>
    <text x="135" y="214">Claude Code</text>
    <!-- Memmy -->
    <circle cx="120" cy="270" r="5" fill="#3b82f6"/>
    <text x="135" y="274">Memmy</text>
    <!-- WorkBuddy -->
    <circle cx="120" cy="340" r="5" fill="#14b8a6"/>
    <text x="135" y="344">WorkBuddy</text>
  </g>

  <!-- 中心 Hub -->
  <g transform="translate(520, 210)">
    <rect x="-60" y="-32" width="120" height="64" rx="12" fill="url(#hub)" opacity="0.15"/>
    <rect x="-60" y="-32" width="120" height="64" rx="12" fill="none" stroke="url(#hub)" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">MemoryHub</text>
    <text x="0" y="14" text-anchor="middle" font-family="monospace" font-size="9" fill="#71717a">9 agents · 255+ memories</text>
  </g>

  <!-- 右侧输出线 -->
  <g stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 580 210 Q 760 170 940 130" stroke="#3b82f6"/>
    <path d="M 580 210 Q 760 210 940 210" stroke="#8b5cf6"/>
    <path d="M 580 210 Q 760 250 940 290" stroke="#3b82f6"/>
  </g>

  <!-- 右侧输出面板 -->
  <g font-family="-apple-system, sans-serif" font-size="10" fill="#a1a1aa">
    <rect x="940" y="115" width="100" height="30" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="950" y="134">🔍 Search</text>
    <rect x="940" y="195" width="100" height="30" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="950" y="214">✏️ Edit</text>
    <rect x="940" y="275" width="100" height="30" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="950" y="294">🔄 Sync</text>
  </g>

  <!-- 标题文字区 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="520" y="60" text-anchor="middle" font-size="13" fill="#3b82f6" letter-spacing="3" font-weight="600">UNIFIED MEMORY MANAGER</text>
    <text x="520" y="105" text-anchor="middle" font-size="28" font-weight="800" fill="#fafafa">Agent 记忆统一管理中心</text>
    <text x="520" y="365" text-anchor="middle" font-size="13" fill="#71717a">在一个轻量桌面应用中浏览、搜索、编辑、同步所有 AI Agent 的记忆</text>
  </g>
</svg>
