<svg viewBox="0 0 1200 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MemoryHub 架构图：Agent 文件系统 → Scanner+Parser → 统一界面">
  <title>MemoryHub 架构图</title>
  <rect width="1200" height="300" rx="12" fill="#0a0a0a"/>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="600" y="35" text-anchor="middle" font-size="14" fill="#71717a" letter-spacing="2">HOW IT WORKS</text>
  </g>

  <!-- 三层架构 -->
  <g font-family="-apple-system, sans-serif">
    <!-- 数据源层 -->
    <g transform="translate(60, 70)">
      <rect width="240" height="70" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="120" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#a855f7">Agent 文件系统</text>
      <text x="120" y="45" text-anchor="middle" font-size="11" fill="#71717a">~/.hermes  ~/.codex  ~/.claude</text>
      <text x="120" y="60" text-anchor="middle" font-size="11" fill="#71717a">~/.memmy  ~/.workbuddy ...</text>
    </g>

    <!-- 箭头 -->
    <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M 310 105 L 380 105"/>
      <polygon points="380,105 372,101 372,109" fill="#3b82f6" opacity="0.5"/>
    </g>

    <!-- 扫描引擎层 -->
    <g transform="translate(390, 70)">
      <rect width="240" height="70" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="120" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Scanner + Parser</text>
      <text x="120" y="45" text-anchor="middle" font-size="11" fill="#71717a">Markdown · SQLite · JSON</text>
      <text x="120" y="60" text-anchor="middle" font-size="11" fill="#71717a">§分隔 · Task分组 · ##标题</text>
    </g>

    <!-- 箭头 -->
    <g stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M 640 105 L 710 105"/>
      <polygon points="710,105 702,101 702,109" fill="#8b5cf6" opacity="0.5"/>
    </g>

    <!-- 统一管理层 -->
    <g transform="translate(720, 70)">
      <rect width="400" height="70" rx="8" fill="#18181b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="200" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#8b5cf6">MemoryHub 统一界面</text>
      <text x="200" y="45" text-anchor="middle" font-size="11" fill="#71717a">浏览 · 搜索 · 编辑 · 排序 · 备份 · 同步</text>
      <text x="200" y="60" text-anchor="middle" font-size="11" fill="#71717a">三栏可拖拽布局 · 暗色模式 · Markdown 渲染</text>
    </g>
  </g>

  <!-- 底部技术栈 -->
  <g transform="translate(60, 180)" font-family="monospace" font-size="11">
    <rect width="100" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="50" y="18" text-anchor="middle" fill="#f97316">Tauri 2</text>
    <rect x="115" width="80" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="155" y="18" text-anchor="middle" fill="#22c55e">React 19</text>
    <rect x="210" width="90" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="255" y="18" text-anchor="middle" fill="#3b82f6">TypeScript</text>
    <rect x="315" width="100" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="365" y="18" text-anchor="middle" fill="#06b6d4">TailwindCSS 4</text>
    <rect x="430" width="80" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="470" y="18" text-anchor="middle" fill="#a855f7">Rust</text>
    <rect x="525" width="90" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="570" y="18" text-anchor="middle" fill="#14b8a6">SQLite</text>
    <rect x="630" width="80" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="670" y="18" text-anchor="middle" fill="#f59e0b">Vite 7</text>
  </g>

  <!-- 底部说明 -->
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#52525b">
    <text x="600" y="260" text-anchor="middle">不改变原始文件结构 · 内容始终在 Agent 原处 · 删除 MemoryHub 不影响任何 Agent</text>
    <text x="600" y="278" text-anchor="middle">~10MB 轻量安装 · macOS 原生菜单栏支持</text>
  </g>
</svg>
